name: Build and Push to Docker Hub

on:
  # Runs directly when application code changes
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'templates/**'
      - 'main.py'
      - 'Dockerfile'
      - 'requirements.txt'

  # Runs after Terraform Deploy finishes successfully (useful if infrastructure updates)
  workflow_run:
    workflows: ["Terraform Deploy"]
    types:
      - completed

  workflow_dispatch:


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # safety check: Only run if the terraform workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Configure AWS Credentials for ECR
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build and Push to BOTH registries at once
      - name: Build and Push Docker Image to Docker Hub and ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/weather_app:latest
            ${{ secrets.DOCKER_USERNAME }}/weather_app:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/weather_app:latest
            ${{ steps.login-ecr.outputs.registry }}/weather_app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

